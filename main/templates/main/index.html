{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="only light">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="font-src 'self' data:;">

    <title>{{ title }}</title>

    <script>
        window.RECAPTCHA_SITE_KEY = "{{ site_key }}";
    </script>
    <script src="https://www.google.com/recaptcha/api.js?render={{ site_key }}" async defer></script>

    <link rel="icon" type="image/png" href="{% static 'favicon.png' %}">

    {% for css in manifest_css %}
        <link rel="preload" href="/static/svelte/assets/{{ css }}" as="style">
    {% endfor %}

    {% for css in manifest_css %}
        <link rel="stylesheet" crossorigin href="/static/svelte/assets/{{ css }}" media="print" onload="this.media='all'">
    {% endfor %}
</head>

<body>
    <div class="app" id="app"></div>

    <script type="module" crossorigin src="/static/svelte/assets/{{ manifest_js }}"></script>
</body>
</html>
